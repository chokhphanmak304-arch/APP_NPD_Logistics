# เครื่อง dev มี RAM 13.7 GB และมักเปิด VS Code/Chrome/Odoo/อีมูเลเตอร์ค้างไว้
# พร้อมกัน เหลือว่างจริงราว 2 GB เท่านั้น
#
# ค่าเดิม -Xmx8G + Metaspace 4G ขอเกือบ 12 GB, ลดเป็น 4G แล้วก็ยังตาย
# (hs_err: "Native memory allocation (malloc) failed ... The system is out of
# physical RAM") เพราะ JVM ต้องจองหน่วยความจำจริงตั้งแต่ตอนเริ่ม
#
# 2G พอสำหรับแอปนี้ — เคย build release สำเร็จมาแล้วในเวลา 44 วินาที
# ถ้าอนาคตโปรเจกต์ใหญ่ขึ้นจน build ไม่พอ ค่อยขยับขึ้นทีละ 512m
# แต่ต้องปิดโปรแกรมอื่นก่อน ไม่ใช่เพิ่มค่าอย่างเดียว
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
