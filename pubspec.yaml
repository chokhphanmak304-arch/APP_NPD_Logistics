name: npd_transport_app
description: "NPD Logistics - ระบบจัดการการขนส่ง"
publish_to: 'none'
version: 1.1.6+21  # 🆕 UI ใหม่ + แจ้งเตือนงาน + popup อัปเดต + รายได้ตามรอบ

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  http: ^1.1.0
  
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Loading animations
  flutter_spinkit: ^5.2.0
  
  # Date formatting
  intl: ^0.19.0
  
  # URL launcher for Google Maps
  url_launcher: ^6.2.5
  
  # Google Maps
  google_maps_flutter: ^2.10.0
  
  # Location & GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  geocoding: ^3.0.0
  
  # Battery info
  battery_plus: ^6.0.2
  
  # Background location tracking
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.3.1
  
  # ✅ FIXED: Camera & Image - Updated for better stability
  image_picker: ^1.1.2
  image: ^4.1.0
  
  # Signature
  signature: ^5.4.0
  
  # Share
  share_plus: ^7.2.2
  
  # File path
  path_provider: ^2.1.2
  
  # ✅ NEW: Better file access handling
  file: ^7.0.0

  # 🔔 In-App Update (Google Play) - แจ้งเตือนเมื่อมีเวอร์ชันใหม่ที่ Google อนุมัติแล้ว
  in_app_update: ^4.2.3

  # 🔔 Local Notifications - แจ้งเตือนงานใหม่ขึ้นแถบแจ้งเตือนมือถือ
  flutter_local_notifications: ^17.2.4

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/192x192.png
    - assets/images/icon_npd.png

  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Kanit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Kanit-Light.ttf
          weight: 300

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/192x192.png"
  min_sdk_android: 21
  remove_alpha_ios: true
